[project]
name = "parcelpilot"
version = "0.1.0"
description = "ParcelPilot support agent — LangGraph orchestrator + addable tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2",
    "pydantic-settings>=2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.3",
    "pypdf>=5.0",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.2",
    "rank-bm25>=0.2",
    "psycopg[binary]>=3",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
